<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Sanketh</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b181c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>matchMedia("(prefers-reduced-motion: reduce)").matches || document.documentElement.classList.add("js")</script>
<style>
  .lost { position: relative; min-height: 100dvh; display: grid; place-items: center; overflow: clip; isolation: isolate; text-align: center; padding: 2rem var(--pad); }
  .lost__shade { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(11,24,28,.82) 0%, rgba(11,24,28,.45) 55%, rgba(11,24,28,.2) 100%); }
  .lost__inner { position: relative; }
  .lost__code { font: 600 clamp(7rem, 30vw, 22rem)/.8 var(--f-sans); letter-spacing: -.08em; margin: 0; color: var(--cream); }
  .lost__code em { color: var(--copper); }
  .lost__h { font: 400 clamp(1.4rem, 3vw, 2.4rem)/1.2 var(--f-sans); letter-spacing: -.03em; margin: 2rem 0 .8rem; }
  .lost__h em { color: var(--sage); }
  .lost p { color: var(--muted); margin: 0 auto 2.4rem; max-width: 36ch; }
  .lost .btn svg { transform: rotate(90deg); }
  .lost .btn:hover svg { transform: rotate(90deg) translateY(3px); }
  .lost .btn { animation: rise 1.4s var(--ease) .9s both; }
  .js [data-a] { visibility: hidden; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } }
</style>
</head>
<body>
<main class="lost">
  <canvas class="flow" data-flow aria-hidden="true"></canvas>
  <div class="lost__shade" aria-hidden="true"></div>
  <div class="lost__inner">
    <h1 class="lost__code" data-a="letters">4<em>0</em>4</h1>
    <p class="lost__h" data-a="words">This page drifted <em>off the map.</em></p>
    <p data-a="words">The link may be broken, or the page may have moved. The rest of the portfolio is still here.</p>
    <a class="btn" href="/"><span data-a="letters">Back to home</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg></a>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="/flow.js"></script>
<script>
  // same letter / word assembly as the portfolio
  (() => {
    const els = [...document.querySelectorAll("[data-a]")];
    if (!window.gsap || !document.documentElement.classList.contains("js")) { els.forEach((e) => (e.style.visibility = "visible")); return; }
    const D = [[-60, 0, -25], [0, 70, 18], [60, 0, 25], [0, -70, -18]];
    els.forEach((el, k) => {
      const letters = el.dataset.a === "letters", bits = [], plain = el.textContent.trim().replace(/\s+/g, " ");
      const walk = (node) => [...node.childNodes].forEach((n) => {
        if (n.nodeType === 1) return walk(n);
        if (n.nodeType !== 3 || !n.textContent.trim()) return;
        const f = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach((part) => {
          if (!part) return;
          if (/^\s+$/.test(part)) return f.append(part);
          const w = document.createElement("span");
          w.className = "word"; w.setAttribute("aria-hidden", "true");
          if (letters) [...part].forEach((ch) => { const b = document.createElement("span"); b.className = "bit"; b.textContent = ch; w.append(b); bits.push(b); });
          else { w.classList.add("bit"); w.textContent = part; bits.push(w); }
          f.append(w);
        });
        n.replaceWith(f);
      });
      walk(el);
      const sr = document.createElement("span"); sr.className = "sr-only"; sr.textContent = plain; el.append(sr);
      el.style.visibility = "visible";
      gsap.fromTo(bits,
        letters ? { opacity: 0, x: (i) => D[i % 4][0], y: (i) => D[i % 4][1], rotate: (i) => D[i % 4][2], scale: 2 } : { opacity: 0, y: "0.9em", rotate: 6 },
        { opacity: 1, x: 0, y: 0, rotate: 0, scale: 1, ease: "power3.out", duration: 1.3, delay: 0.2 + k * 0.3, stagger: { amount: letters ? 0.4 : 0.5 } });
    });
  })();
</script>
</body>
</html>
